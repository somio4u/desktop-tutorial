# Render Blueprint: Dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: series-cast-crew
    runtime: docker
    plan: starter            # persistent disk needs a paid plan; free plan loses data on restart
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data   # db.json, selfies, Google token live here
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # you type it in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false          # e.g. https://series-cast-crew.onrender.com
