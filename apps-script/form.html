<!DOCTYPE html>
<html lang="or"><head><base target="_top"><meta charset="utf-8">
<?!= include('styles') ?>
</head>
<body><div class="wrap narrow">
<div id="notfound" class="hidden card">ଏହି link ଠିକ୍ ନୁହେଁ।</div>
<div id="main" class="hidden">
  <div class="mute">Cast &amp; Crew Registration</div>
  <h1 id="title"></h1>
  <p class="mute">ଆପଣଙ୍କ ବିବରଣୀ ପୂରଣ କରନ୍ତୁ। (Fill in your details)</p>
  <div class="card">
    <label>ଆପଣ କିଏ? (Who are you?)</label>
    <div class="seg"><button type="button" id="b-crew" class="on">Crew</button><button type="button" id="b-artist">Artist / Casting</button></div>
    <form id="f" novalidate>
      <label for="name">ନାମ (Name)</label><input id="name" autocomplete="name" maxlength="100">
      <label for="phone">ଫୋନ୍ ନମ୍ବର (Phone number)</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">

      <div id="crew-fields">
        <label for="dept">ବିଭାଗ (Department)</label><select id="dept"><option value="">— ବାଛନ୍ତୁ —</option></select>
        <div id="role-wrap" class="hidden"><label for="role">ପଦବୀ (Designation)</label><select id="role"></select></div>
        <div id="role-text-wrap" class="hidden"><label for="roletext">ପଦବୀ (Designation)</label><input id="roletext" maxlength="100" placeholder="ଯେପରି: Production Manager"></div>
      </div>

      <div id="artist-fields" class="hidden">
        <label for="character">ଚରିତ୍ରର ନାମ (ଆପଣ ଯେଉଁ ଚରିତ୍ର କରୁଛନ୍ତି) (Character name)</label><input id="character" maxlength="100">
        <label for="age">ବୟସ (Age)</label><input id="age" type="number" inputmode="numeric" min="1" max="119">
        <label for="gender">ଲିଙ୍ଗ (Gender)</label>
        <select id="gender"><option value="">— ବାଛନ୍ତୁ —</option><option value="Male">ପୁରୁଷ (Male)</option><option value="Female">ମହିଳା (Female)</option><option value="Other">ଅନ୍ୟ (Other)</option></select>
        <label>Selfie (ସେଲଫି)</label>
        <div class="selfie-box">
          <img id="preview" class="hidden" alt="selfie">
          <div><button type="button" class="ghost" id="selfieBtn">📷 Selfie ନିଅନ୍ତୁ</button>
          <input id="selfie" type="file" accept="image/*" capture="user" class="hidden"></div>
        </div>
      </div>
      <div class="err" id="err"></div>
      <button class="full" id="submit" type="submit">ଦାଖଲ କରନ୍ତୁ (Submit)</button>
    </form>
  </div>
</div>
<div id="done" class="hidden card done"><div class="tick">✔</div><h2>ଧନ୍ୟବାଦ!</h2><p class="mute" id="doneMsg">ଆପଣଙ୍କ entry ସେଭ୍ ହୋଇଗଲା।</p>
  <p class="mute">ଆଉ ଏକ ପଦବୀ / ଚରିତ୍ର ପାଇଁ entry କରିବାକୁ ଚାହାଁନ୍ତି କି?</p>
  <button id="another" type="button">➕ ଆଉ ଏକ entry ଯୋଡ଼ନ୍ତୁ</button></div>
</div>
<script>
const DATA = <?!= data ?>;
const $ = (i) => document.getElementById(i);
const cfg = DATA.departments;
let type = 'crew', selfie = '';
const run = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler((e) => no(new Error((e && e.message) || String(e))))[fn](...a));

if (!DATA.found) $('notfound').classList.remove('hidden');
else {
  $('title').textContent = DATA.name;
  Object.keys(cfg).forEach((k) => $('dept').add(new Option(cfg[k].label, k)));
  $('main').classList.remove('hidden');
}

function setType(t) {
  type = t;
  $('b-crew').classList.toggle('on', t === 'crew');
  $('b-artist').classList.toggle('on', t === 'artist');
  $('crew-fields').classList.toggle('hidden', t !== 'crew');
  $('artist-fields').classList.toggle('hidden', t !== 'artist');
  $('err').textContent = '';
}
$('b-crew').onclick = () => setType('crew');
$('b-artist').onclick = () => setType('artist');

$('dept').onchange = () => {
  const d = cfg[$('dept').value];
  $('role-wrap').classList.toggle('hidden', !d || !d.roles);
  $('role-text-wrap').classList.toggle('hidden', !d || !!d.roles);
  if (d && d.roles) {
    const r = $('role'); r.innerHTML = '<option value="">— ବାଛନ୍ତୁ —</option>';
    d.roles.forEach((x) => r.add(new Option(x, x)));
    if (d.roles.length === 1) r.value = d.roles[0];   // only one choice: pre-select it
  }
};

$('selfieBtn').onclick = () => $('selfie').click();
$('selfie').onchange = () => {
  const f = $('selfie').files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 800, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    selfie = c.toDataURL('image/jpeg', 0.8);
    $('preview').src = selfie; $('preview').classList.remove('hidden');
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

$('another').onclick = () => {   // keep name + phone, clear everything entry-specific
  ['dept', 'role', 'roletext', 'character', 'age', 'gender'].forEach((i) => ($(i).value = ''));
  $('dept').onchange(); selfie = ''; $('selfie').value = ''; $('preview').classList.add('hidden');
  $('err').textContent = ''; $('submit').disabled = false;
  $('done').classList.add('hidden'); $('main').classList.remove('hidden');
};

$('f').onsubmit = async (e) => {
  e.preventDefault();
  const err = (m) => ($('err').textContent = m);
  err('');
  const body = { type, name: $('name').value, phone: $('phone').value };
  if (!body.name.trim()) return err('ନାମ ଲେଖନ୍ତୁ');
  if (!/^\+?[0-9 \-]{8,16}$/.test(body.phone.trim())) return err('ସଠିକ୍ ଫୋନ୍ ନମ୍ବର ଦିଅନ୍ତୁ');
  if (type === 'crew') {
    body.department = $('dept').value;
    if (!body.department) return err('ବିଭାଗ ବାଛନ୍ତୁ');
    body.designation = cfg[body.department].roles ? $('role').value : $('roletext').value;
    if (!body.designation.trim()) return err('ପଦବୀ ବାଛନ୍ତୁ / ଲେଖନ୍ତୁ');
  } else {
    Object.assign(body, { character: $('character').value, age: $('age').value, gender: $('gender').value, selfie });
    if (!body.character.trim()) return err('ଚରିତ୍ରର ନାମ ଲେଖନ୍ତୁ');
    if (!body.age) return err('ବୟସ ଦିଅନ୍ତୁ');
    if (!body.gender) return err('ଲିଙ୍ଗ ବାଛନ୍ତୁ');
    if (!selfie) return err('Selfie ନିଅନ୍ତୁ');
  }
  $('submit').disabled = true;
  try {
    const j = await run('submitEntry', DATA.slug, body);
    $('doneMsg').textContent = j.duplicate ? 'ଏହି entry ପୂର୍ବରୁ ଅଛି (ପୁଣି ଯୋଡ଼ାଗଲା ନାହିଁ)।' : 'ଆପଣଙ୍କ entry ସେଭ୍ ହୋଇଗଲା।';
    $('main').classList.add('hidden'); $('done').classList.remove('hidden');
  } catch (x) { err(x.message); $('submit').disabled = false; }
};
</script></body></html>
